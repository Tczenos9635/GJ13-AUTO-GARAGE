name: Android Build & APK Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || true

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --continue || ./gradlew testDebugUnitTest --continue || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare APK Output
        run: |
          mkdir -p build/outputs/release_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build/outputs/release_apk/GJ13_Auto_Garage.apk \;
          ls -la build/outputs/release_apk/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GJ13_Auto_Garage_APK
          path: build/outputs/release_apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/release_apk/*.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
