name: Android Build & APK Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Keystore and Environment
        run: |
          touch .env
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore for GitHub runner..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build/outputs/release_apk
          cp app/build/outputs/apk/debug/*.apk build/outputs/release_apk/GJ13_Auto_Garage.apk
          ls -la build/outputs/release_apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GJ13_Auto_Garage_APK
          path: build/outputs/release_apk/GJ13_Auto_Garage.apk
          retention-days: 30

      - name: Create GitHub Release
        id: create_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/release_apk/GJ13_Auto_Garage.apk
          tag_name: v1.0.0
          name: GJ13 Auto Garage v1.0.0 (Official APK)
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log Build Summary
        run: |
          echo "### 🚀 GJ13 AUTO GARAGE — APK Ready! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Name:** \`GJ13_Auto_Garage.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $(ls -lh build/outputs/release_apk/GJ13_Auto_Garage.apk | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Successfully Built!" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK directly from the **Artifacts** section above or from the **Releases** tab on the right." >> $GITHUB_STEP_SUMMARY

